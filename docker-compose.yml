services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: api-gateway:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: ${DOCKER_AUTH_SERVICE_URL:-http://host.docker.internal:8083}
      FACTURACION_SERVICE_URL: ${DOCKER_FACTURACION_SERVICE_URL:-}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      AUTH_VALIDATE_PATH: ${AUTH_VALIDATE_PATH:-/api/auth/me}
      TOKEN_CACHE_TTL_MS: ${TOKEN_CACHE_TTL_MS:-30000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-10}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

