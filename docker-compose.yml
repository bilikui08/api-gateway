services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: api-gateway:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: ${DOCKER_AUTH_SERVICE_URL:-http://host.docker.internal:8083}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

